[project]
name = "deadcodeanalyzer"
version = "0.1.0"
description = "Dead code analysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.2",
  "sqlalchemy>=2.0.35",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["B008", "E501"]
